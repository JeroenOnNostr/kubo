repository: https://github.com/JeroenOnNostr/kubo

name: Kubo

summary: A YouTube Kids alternative built around trust, not algorithms.

description: |
  Kubo is a YouTube Kids alternative built around trust, not algorithms.

  Parents decide which people, feeds, and content their child can access. Kubo avoids black-box recommendations, addictive design patterns, and behavioral tracking.

  Instead of letting a platform decide what your child sees, Kubo uses webs of trust: parents can create an online environment shaped by family, friends, schools, creators, and communities they actually know.

  Built on Nostr, Kubo is also a reference implementation for TEPP: the Trust Extended Permissions Protocol.

  Learn more:
  https://kubo.watch
  https://weboftrustfoundation.com

tags:
