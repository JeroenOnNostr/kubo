image: node:24

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

stages:
  - test
  - build
  - release
  - publish

test:
  stage: test
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - npm run test

build-web:
  stage: build
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  dependencies:
    - test
  script:
    - npm ci
    - npm run build
    - cp dist/index.html dist/404.html
  artifacts:
    expire_in: 3 hours
    paths:
      - dist/

release-notes:
  stage: build
  timeout: 2 minutes
  rules:
    - if: $CI_COMMIT_TAG =~ /^kubo-v\d+\.\d+\.\d+$/
  script:
    # Extract release notes from CHANGELOG.md for this tag.
    # release-notes.md is the full section (summary + bulleted lists), used as
    # the GitLab Release description. release-notes-summary.txt is the leading
    # plaintext paragraph only, used as the App Store / Play Store release
    # blurb. Falls back to "Ditto vX.Y.Z" when the section has no summary.
    - mkdir -p artifacts
    - node scripts/extract-release-notes.mjs "$CI_COMMIT_TAG" > artifacts/release-notes.md
    - node scripts/extract-release-notes.mjs "$CI_COMMIT_TAG" --summary > artifacts/release-notes-summary.txt
    - echo "--- release-notes.md ---"
    - cat artifacts/release-notes.md
    - echo "--- release-notes-summary.txt (length $(wc -c < artifacts/release-notes-summary.txt)) ---"
    - cat artifacts/release-notes-summary.txt
    - echo "------------------------"
    # Warn (don't fail) when the summary exceeds the documented 500-character
    # limit so the user spots it before App Store / Play Store reject the upload.
    - |
      SUMMARY_LEN=$(wc -c < artifacts/release-notes-summary.txt)
      if [ "$SUMMARY_LEN" -gt 501 ]; then
        echo "WARNING: release-notes-summary.txt is $SUMMARY_LEN bytes; convention is <=500."
      fi
  artifacts:
    paths:
      - artifacts/release-notes.md
      - artifacts/release-notes-summary.txt
    expire_in: 90 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^kubo-v\d+\.\d+\.\d+$/
  needs:
    - job: release-notes
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - test -f artifacts/release-notes.md
    - echo "--- release-notes.md ---"
    - cat artifacts/release-notes.md
    - echo "------------------------"
  release:                               # See https://docs.gitlab.com/ci/yaml/#release for available properties
    tag_name: '$CI_COMMIT_TAG'
    name: '$CI_COMMIT_TAG'
    description: './artifacts/release-notes.md'

publish-web:
  image: alpine
  stage: publish
  before_script:
    - 'which ssh-agent || ( apk add --update openssh )'
    - apk add --update bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    # Install rsync
    - apk add rsync
    - rsync --version
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_TAG =~ /^kubo-v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  dependencies:
    - release
    - build-web
  environment:
    name: demo.kubo.watch
    url: https://demo.kubo.watch
  script:
    - rsync -avz --delete -e ssh dist/. weboftrustfoundation_9rsu0j7cylw@demo.kubo.watch:/var/www/vhosts/weboftrustfoundation.org/demo.kubo.watch
    - echo "----------------------------------------------------------------------"
    - echo "Deployment ready (tag "$CI_COMMIT_TAG"), check https://demo.kubo.watch"
    - echo "----------------------------------------------------------------------"